name = "calvary-email-studio"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./public"

# Email templates (HTML text) live in KV.
# Create it with:  npx wrangler kv namespace create TEMPLATES
# then paste the id it prints below.
[[kv_namespaces]]
binding = "TEMPLATES"
id = "8c9946375645408d9b6caa804630e507"

# Hosted images live in R2.
# Create it with:  npx wrangler r2 bucket create email-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "email-images"

# Optional: once you attach a custom domain, set it here so image URLs in your
# emails always use it, e.g.  PUBLIC_BASE_URL = "https://email.calvarystudents.org"
# [vars]
# PUBLIC_BASE_URL = ""

# The password is NOT stored here. It is a Cloudflare secret called APP_PASSWORD
# (see README.md).
